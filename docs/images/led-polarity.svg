<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230">
<rect width="760" height="230" rx="16" fill="#f4f5f7"/>
<g font-family="sans-serif" fill="#152334" font-size="21">
<text x="28" y="38" font-weight="bold">LEDの脚と基板ランドの対応</text>
<rect x="38" y="68" width="60" height="60" fill="#b5bec8" stroke="#182331" stroke-width="3"/>
<text x="120" y="95">四角いランド　K−</text><text x="120" y="124">短い脚・マイナス</text>
<rect x="402" y="68" width="60" height="60" rx="25" fill="#b5bec8" stroke="#182331" stroke-width="3"/>
<text x="484" y="95">丸みのあるランド　A+</text><text x="484" y="124">長い脚・プラス</text>
<text x="28" y="183" font-size="18">左右の並びは見る面で反転します。ランドの形と A+ / K− を確認。</text>
<text x="28" y="211" font-size="18">LEDの本体はドット絵側、はんだ付けは電池ケース側。</text>
</g></svg>
